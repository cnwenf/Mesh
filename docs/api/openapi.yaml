      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Mfa Verify Api V1 Auth Mfa Verify Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/refresh:
    post:
      tags:
      - auth
      summary: Refresh
      description: 'Renew an access token (§3.8 bounded idempotent rotation).


        Transport is determined by CREDENTIAL PRESENTATION, never by a client

        self-declaration (R4-H1): the ``mesh_session`` cookie marks a web-origin

        session (rotation delivered via ``Set-Cookie``); ``Bearer mesh_rft_…``

        marks a device-origin session (rotation delivered in the body). Exactly

        one transport per request — presenting both is an ambiguous request (400),

        presenting neither is unauthenticated (401). A cookie refresh additionally

        passes the Origin/Referer same-site check (CSRF defence in depth).'
      operationId: refresh_api_v1_auth_refresh_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Refresh Api V1 Auth Refresh Post
  /api/v1/auth/forgot-password:
    post:
      tags:
      - auth
      summary: Forgot Password
      operationId: forgot_password_api_v1_auth_forgot_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Forgot Password Api V1 Auth Forgot Password Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
