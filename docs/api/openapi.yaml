  /api/v1/realtime/events:
    get:
      tags:
      - realtime
      summary: Reconcile Events
      description: Return stored events for ``channel`` with ``seq > since`` (keyset paged).
      operationId: reconcile_events_api_v1_realtime_events_get
      parameters:
      - name: channel
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          title: Channel
      - name: since
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Since
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 200
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelope_ReconciledEvent_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
