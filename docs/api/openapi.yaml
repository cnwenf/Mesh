          anyOf:
          - type: string
          - type: 'null'
          title: Cycle Id
        project_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Project Id
      type: object
      title: BulkChanges
      description: Field set applicable in bulk (issue.md §1.2.5 / §5.5).
    BulkRequest:
      properties:
        issue_ids:
          items:
            type: string
          type: array
          maxItems: 100
          minItems: 1
          title: Issue Ids
        changes:
          anyOf:
          - $ref: '#/components/schemas/BulkChanges'
          - type: 'null'
