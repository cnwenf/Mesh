          type: boolean
          title: Delete
          default: false
        confirm:
          type: boolean
          title: Confirm
          default: false
      type: object
      required:
      - issue_ids
      title: BulkRequest
      description: 'POST /issues/bulk.


        ``delete: true`` bulk soft-deletes; otherwise ``changes`` is applied to

        every issue. A ``project_id`` change is a cross-project move and requires

        ``confirm: true`` (the §3.8 two-step contract applies per issue).'
    CancelRequest:
      properties:
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
      type: object
      title: CancelRequest
