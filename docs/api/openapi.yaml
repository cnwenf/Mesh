      summary: Create Integration
      description: 'Create an integration.


        A DingTalk app key''s first claim is serialized globally and proven with a

        side-effect-free platform credential check before any row is committed.

        Later integrations may share that app only inside its owner workspace and

        must share one credential and Stream reconnect policy while keeping a

        unique ``(corp_id, robot_code)`` route.'
      operationId: create_integration_api_v1_workspaces__workspace_id__integrations_post
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          title: Workspace Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIntegrationRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Create Integration Api V1 Workspaces  Workspace Id  Integrations Post
        '409':
          description: 'Name conflict, or DingTalk app ownership/group conflict: `dingtalk_app_key_conflict`,
            `dingtalk_route_conflict`, `dingtalk_app_credential_conflict`, or `dingtalk_stream_config_conflict`.'
        '422':
          description: Request validation or first-claim proof rejection (`dingtalk_credentials_invalid`).
        '502':
          description: First-claim proof could not reach DingTalk (`dingtalk_credential_verification_unavailable`).
