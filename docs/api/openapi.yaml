        rate_limit_window_seconds:
          type: integer
          minimum: 1.0
          title: Rate Limit Window Seconds
          default: 3600
        concurrency_limit:
          type: integer
          minimum: 1.0
          title: Concurrency Limit
          default: 1
        require_approval:
