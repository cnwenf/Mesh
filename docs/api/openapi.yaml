      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      - name: subpath
        in: path
        required: true
        schema:
          type: string
          title: Subpath
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /__mesh_entry/w/{slug}:
    get:
      tags:
      - entry
      summary: Mesh Entry Bare
      description: Entry probe for the workspace root ``/w/{slug}`` document request.
      operationId: mesh_entry_bare___mesh_entry_w__slug__get
      parameters:
      - name: slug
        in: path
