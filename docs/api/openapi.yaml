  /api/v1/auth/reauth:
    post:
      tags:
      - auth
      summary: Reauth
      description: 'Step-up re-authentication (auth.md §3.1, R6-H3): refresh the current

        WEB session''s ``authenticated_at`` by re-verifying the primary credential.

        Revoked/expired sessions cannot reauth (the invariant serves exactly the

        stale sessions — but never dead ones).'
      operationId: reauth_api_v1_auth_reauth_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Reauth Api V1 Auth Reauth Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/token:
    get:
      tags:
      - auth
      summary: Introspect Token
      description: 'Self-introspection (review H7): metadata for the CURRENT credential —

        kind/token_id/masked prefix/scopes/expiry/last-use, never a plaintext

        fragment. Powers ``mesh auth status``.'
      operationId: introspect_token_api_v1_auth_token_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Introspect Token Api V1 Auth Token Get
    delete:
      tags:
      - auth
      summary: Revoke Token Self
      description: 'Self-revocation (review H7): revoke the presented credential itself —

        no token id needed. PAT: immediate 401 afterwards; session: refresh dies

        at once, access with its TTL. Powers ``mesh auth logout --revoke``.'
      operationId: revoke_token_self_api_v1_auth_token_delete
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Revoke Token Self Api V1 Auth Token Delete
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: Logout
      description: 'Revoke the session named by the presented credential (auth.md §3.1).


        Web: the ``mesh_session`` cookie; CLI: ``Bearer mesh_rft_…``; as a last

        resort an access JWT''s ``sid`` (so ``mesh auth logout`` with only the

        in-memory access still revokes its session). The cookie is cleared either

        way.'
      operationId: logout_api_v1_auth_logout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Logout Api V1 Auth Logout Post
