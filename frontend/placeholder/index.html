<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mesh</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a; color: #e2e8f0;
    }
    main { text-align: center; padding: 2rem; max-width: 40rem; }
    h1 { font-size: 2.5rem; margin: 0 0 0.5rem; }
    p { color: #94a3b8; line-height: 1.6; }
    code { background: #1e293b; padding: 0.15rem 0.4rem; border-radius: 4px; }
    .badge { display: inline-block; margin-top: 1rem; padding: 0.35rem 0.8rem;
             border: 1px solid #334155; border-radius: 999px; font-size: 0.85rem; color: #cbd5e1; }
  </style>
</head>
<body>
  <main>
    <h1>Mesh</h1>
    <p>AI-native team workspace — the frontend is a placeholder in this phase.</p>
    <p>
      API: <code>GET /api/v1/ping</code> &nbsp;·&nbsp;
      Health: <code>GET /healthz</code> &nbsp;·&nbsp;
      Realtime: <code>WS /ws</code>
    </p>
    <span class="badge">backend skeleton · phase 1</span>
  </main>
</body>
</html>
