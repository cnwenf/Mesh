# Production front-door for the real SPA (H5). Serves the built bundle and
# reverse-proxies the API + WebSocket gateway on the SAME origin, so the
# browser never makes a cross-origin request (no CORS needed; README §2.2 /
# auth.md §5.5 production deployment shape).

# §5.3 硬约束(search-command-palette.md):搜索 q 原文不得流入访问日志。nginx 默认
# combined 记录含 query 的 $request,会把 `?q=<原文>` 落盘。此处自定义日志格式仅记
# method + path($uri,**不含 $args 查询串**),使任何路由的查询参数(搜索 q 等)都
# 不进访问日志(纵深防御;uvicorn 层另须关默认 access log / 自管无 query 日志)。
# 本文件经 conf.d 包含于 http 上下文,log_format 置于 server 块之外(http 级)合法。
log_format mesh_access '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    # 访问日志改用无查询串格式(§5.3,见上):搜索 q 等查询原文不落盘。
    access_log /var/log/nginx/access.log mesh_access;

    # S1: emit relative Location headers on redirects — the default absolute
    # form is built from the listen port (80), so non-:80 published ports
    # (compose MESH_FRONTEND_PORT, e.g. :3001/:18201) would drop the port on
    # the /index.html → / 308 below. Relative Location keeps the browser on
    # the request's own host:port. Server-level scope also covers the
    # @mesh_slug_moved 301 (search-command-palette.md §3.4): the rebuilt
    # Location stays relative there too, so EXPIRED-slug redirects on
    # non-80/443 deployments (e.g. :3079) keep scheme / host / port.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Attachment uploads can be large; mirror the API's payload ceiling.
    client_max_body_size 64m;

    # Compose embedded DNS; resolve upstreams at request time (via a variable)
    # so nginx starts even if api/gateway are not yet reachable, and so the
    # config is valid outside the compose network too.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Hardening headers on every response (`always` incl. error/proxied). The
    # HTML document's CSP itself comes from the API entry middleware (per-
    # request nonce / static sha256); these are the complementary hardening
    # directives (theme.md §5.3 / security review LOW).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # REST API — same-origin reverse proxy to the api service.
    location /api/ {
        set $mesh_api http://api:8000;
        proxy_pass $mesh_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE streams (chat generations) are long-lived; do not buffer them.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # WebSocket realtime gateway (§6.7 / §6.16 first-frame auth).
    location /ws {
        set $mesh_gateway http://gateway:8081;
        proxy_pass $mesh_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Canonical workspace deep links (search-command-palette.md §3.4). The
    # document request is gated through the API's public entry probe: current
    # slug → 200 and the SPA shell is rendered by the API entry middleware
    # (@app, theme.md §2.3 ①) at the deep-link URL itself; EXPIRED slug
    # (renamed) → the probe 301s, translated to a real HTTP 301 from this
    # front door with the rebuilt Location (query preserved; fragments never
    # reach the server and are inherited by the browser per redirect
    # semantics). Unknown slugs get the SPA too — its client router renders
    # the not-found state.
    #
    # Mechanics (verified against nginx 1.24): auth_request forwards only the
    # literal subrequest URI, so the internal location re-attaches the
    # original path via $request_uri; auth_request turns subrequest 3xx into
    # 500, so the probe's 301 is intercepted and re-coded 401, which the
    # outer error_page then turns into the client-visible 301.
    location ~ ^/w/ {
        auth_request /__mesh_entry;
        auth_request_set $mesh_entry_location $upstream_http_location;
        error_page 401 = @mesh_slug_moved;
        # Fall through to the API entry renderer (never the raw static
        # index.html — M2 redirects that to /, which would break the
        # canonical deep-link URL).
        try_files $uri @app;
    }

    location = /__mesh_entry {
        internal;
        set $mesh_api http://api:8000;
        proxy_pass $mesh_api/__mesh_entry$request_uri;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 301 =401 /__mesh_entry_redirect;
    }

    location = /__mesh_entry_redirect {
        internal;
        return 401;
    }

    location @mesh_slug_moved {
        # 探测端返回相对 Location(/w/{slug}/…?query)。server 级 absolute_redirect
        # off(见上)保证 nginx 不把它补全为绝对地址(补全用 $host,不含端口,非
        # 80/443 部署如 :3079 会丢端口);相对 Location 由浏览器按请求 URL 补全 ——
        # scheme / host / port 均保持,TLS 终结于上游代理时同样正确。
        return 301 $mesh_entry_location;
    }

    # Content-hashed build assets — immutable, served statically. (nginx's
    # add_header inheritance is replaced per-location, so repeat the hardening
    # headers here alongside the cache directive.)
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # M2: never serve the shell statically without a CSP — the raw index.html
    # carries no CSP of its own, so redirect it to the canonical app entry
    # (which the API renders with the per-request nonce / static sha256 CSP).
    location = /index.html {
        return 308 /;
    }

    # App routes: HTML document navigations are rendered by the API entry
    # middleware (theme.md §2.3 ① — per-request __MESH_APPEARANCE__ injection
    # resolved from the HttpOnly mesh_session cookie / route workspace
    # identity, nonce CSP, personalized responses private,no-store while the
    # anonymous shell stays byte-stable and public-cacheable). Existing files
    # (favicon, robots, …) are still served statically.
    location / {
        try_files $uri @app;
    }

    location @app {
        set $mesh_api http://api:8000;
        proxy_pass $mesh_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
