# MES-90 browser acceptance overlay. The production API still performs its
# real first-claim DingTalk credential proof; only the deployment-time OAPI
# base points to a controlled compose-internal peer with a strict synthetic
# credential relation. No service port is published to the host.
services:
  mes90-dingtalk-oapi:
    image: python:3.12-slim
    command: ["python", "/srv/mesh/fake_oapi.py"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./frontend/e2e/mes90/fake_oapi.py:/srv/mesh/fake_oapi.py:ro
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()",
        ]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    environment:
      MESH_DINGTALK_OAPI_BASE: http://mes90-dingtalk-oapi:8080
    depends_on:
      mes90-dingtalk-oapi:
        condition: service_healthy
