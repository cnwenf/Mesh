# MES-160 communications/management acceptance stack.
# The browser reaches only the loopback frontend. PostgreSQL, Redis, MinIO,
# API, and realtime gateway remain private to the Compose network.
services:
  minio:
    ports: !reset []
  api:
    ports: !reset []
    environment:
      MESH_JWT_SECRET: ${MESH_JWT_SECRET:?MESH_JWT_SECRET is required}
      MESH_DEVICE_CODE_PEPPER: ${MESH_DEVICE_CODE_PEPPER:?MESH_DEVICE_CODE_PEPPER is required}
      MESH_SEARCH_CURSOR_SECRET: ${MESH_SEARCH_CURSOR_SECRET:?MESH_SEARCH_CURSOR_SECRET is required}
  gateway:
    ports: !reset []
    environment:
      MESH_JWT_SECRET: ${MESH_JWT_SECRET:?MESH_JWT_SECRET is required}
      MESH_DEVICE_CODE_PEPPER: ${MESH_DEVICE_CODE_PEPPER:?MESH_DEVICE_CODE_PEPPER is required}
  worker:
    environment:
      MESH_JWT_SECRET: ${MESH_JWT_SECRET:?MESH_JWT_SECRET is required}
      MESH_DEVICE_CODE_PEPPER: ${MESH_DEVICE_CODE_PEPPER:?MESH_DEVICE_CODE_PEPPER is required}
