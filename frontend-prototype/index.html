<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mesh AI 原生团队工作区可交互静态原型"
    />
    <title>Mesh · 团队工作区</title>
    <link rel="stylesheet" href="./styles.css" />
    <script>
      (() => {
        const saved = localStorage.getItem("mesh-prototype-theme");
        const dark = matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme =
          saved === "dark" || (!saved && dark) ? "dark" : "light";
      })();
    </script>
    <script defer src="./app.js"></script>
  </head>
  <body>
    <div id="prototype-root" aria-live="polite"></div>
    <div id="overlay-root"></div>
    <div id="toast-region" class="toast-region" aria-live="polite"></div>
    <noscript>
      <div class="no-script">请启用 JavaScript 以浏览 Mesh 静态原型。</div>
    </noscript>
  </body>
</html>
