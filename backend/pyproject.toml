[build-system]
# PYSEC-2026-3447: setuptools sdist exclusion rules lacked Unicode normalization
# (NFD file names bypassed NFC exclusion rules and leaked into source dists);
# fixed in 83.0.0. Build-time only — Mesh ships wheels/images, never sdists.
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh-backend"
version = "0.1.0"
description = "Mesh backend: API, background workers and realtime gateway for the AI-native team workspace"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "pyotp>=2.9",
    "cryptography>=48.0.1",
    "email-validator>=2.1",
    "boto3>=1.34",
    "markdown-it-py>=4.2",
    "Pillow>=10.3",
    "croniter>=2.0",
    "httpx>=0.27",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-rerunfailures>=14",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Makes bare `pytest` (as CI and the README run it) import `tests.*` the same
# way `python -m pytest` does — without this, tests/e2e/conftest.py's
# `from tests.conftest import ...` fails collection.
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-q"
markers = [
    "unit: fast tests, may still use the local PostgreSQL test database",
    "e2e: real-service end-to-end tests (real server processes, real API calls, real database writes)",
]

[tool.coverage.run]
source = ["mesh"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",   # FastAPI idiom: Depends()/Query() in argument defaults
    "UP046",  # Pydantic generic models use the Generic[T] form deliberately
]
