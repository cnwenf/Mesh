[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh-runtime"
version = "0.1.0"
description = "mesh-runtime: the Mesh local execution daemon (runtime registration, claim, isolation, output relay)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
mesh-runtime = "mesh_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-q"
markers = [
    "unit: fast, hermetic tests — fake clock, no network, no real LLM",
    "contract: fake-provider state-machine and crash-recovery contract tests",
    "sandbox: real Linux namespace/cgroup sandbox tests (require root; FAIL, never skip)",
    "isolation: ISO-01~14 real isolation red-line matrix (require root; FAIL, never skip)",
]

[tool.coverage.run]
source = ["mesh_runtime"]
branch = true
# __main__.py: entry shim. sandbox_init.py: the in-sandbox child program — it
# runs as a separate unprivileged process INSIDE the sandbox (unreachable to
# the daemon's coverage tracer); every line of it is exercised end-to-end by
# the real-namespace tests in tests/unit/test_sandbox.py and the ISO matrix.
omit = ["src/mesh_runtime/__main__.py", "src/mesh_runtime/sandbox_init.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
