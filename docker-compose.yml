# Mesh local stack (README §2.2 deployment shape):
#   postgres  — PostgreSQL 16: main storage + outbox + job queue
#   redis     — Redis 7: cache / rate limit / presence / realtime fan-out (NOT a source of truth)
#   api       — FastAPI REST API (stateless)
#   worker    — outbox relay + realtime projector + retention purge (independent asyncio tasks)
#   gateway   — realtime WebSocket gateway (independent process)
#   frontend  — static placeholder page + /api and /ws reverse proxy
#
# SECURITY — LOCAL DEVELOPMENT ONLY (M2 / MES-83 hardening):
#   * NO secrets have defaults. Every credential is a REQUIRED variable
#     (`${VAR:?...}`) — `docker compose up` fails fast if one is missing instead
#     of silently coming up on a guessable password. Local dev: run
#     `scripts/gen-dev-secrets.sh` once to generate a `.env` of strong random
#     values. Production: set real, unique secrets (never the dev ones).
#   * Published ports bind 127.0.0.1 by default — the stack is reachable from
#     this machine only, never the network. Exposing it requires an explicit,
#     deliberate edit below (a .env value alone cannot change the bind address).
#   * Datastores (postgres / redis) publish NO ports at all — they are reachable
#     only on the internal compose network. NEVER add a host port mapping for a
#     datastore; a publicly reachable datastore is exactly how MES-83 happened.
#   * MESH_AUTH_MODE defaults to "dev" (any mesh-dev:<workspace-id> token grants
#     that workspace). That is safe ONLY because the ports are loopback-bound.
#     For ANY non-local use you MUST set MESH_AUTH_MODE=production explicitly.
#   * The API/gateway connect as the restricted non-owner role mesh_app so
#     PostgreSQL RLS is enforced on the app path (M1, README §6.2 rule 5); the
#     worker keeps the owner role for cross-tenant relay/projector/retention.
#   * Redis requires a password (MESH_REDIS_PASSWORD) and runs with
#     protected-mode on — an unauthenticated Redis lets a neighbor forge fan-out
#     frames (L3). The DB remains the source of truth.
#
# Local development values only — every secret is a REQUIRED environment
# variable with no default (see the SECURITY block above). Run
# `scripts/gen-dev-secrets.sh` to generate a local `.env`; supply real, unique
# secrets for anything beyond local dev (see .env.example).
name: mesh

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${MESH_POSTGRES_DB:-mesh}
      POSTGRES_USER: ${MESH_POSTGRES_USER:-mesh}
      # Required — no default (MES-83). gen-dev-secrets.sh fills a strong value.
      POSTGRES_PASSWORD: ${MESH_POSTGRES_PASSWORD:?MESH_POSTGRES_PASSWORD is required (scripts/gen-dev-secrets.sh for local dev)}
    volumes:
      - mesh_pgdata:/var/lib/postgresql/data
    # NO `ports:` — PostgreSQL is reachable only on the internal compose network.
    # Never publish the datastore to the host (MES-83).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MESH_POSTGRES_USER:-mesh} -d ${MESH_POSTGRES_DB:-mesh}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    # L3 / MES-83: require authentication AND keep protected-mode on — an
    # unauthenticated Redis lets any container on the compose network forge
    # realtime fan-out frames, and (worse) a publicly reachable one is a full
    # remote-access vector. The password is REQUIRED with no default;
    # gen-dev-secrets.sh generates a strong local value.
    command:
      - "redis-server"
      - "--requirepass"
      - "${MESH_REDIS_PASSWORD:?MESH_REDIS_PASSWORD is required (scripts/gen-dev-secrets.sh for local dev)}"
      - "--protected-mode"
      - "yes"
    # NO `ports:` — Redis is reachable only on the internal compose network.
    # Never publish the datastore to the host (MES-83 — this is the incident).
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${MESH_REDIS_PASSWORD:?MESH_REDIS_PASSWORD is required (scripts/gen-dev-secrets.sh for local dev)}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # S3-compatible object storage for the attachment module (attachment.md
    # §3): a PRIVATE bucket accessed only through short-lived presigned URLs;
    # bytes never flow through the API process (three-stage direct upload).
    image: minio/minio:RELEASE.2025-06-13T11-33-47Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      # Required — no defaults (MES-83). gen-dev-secrets.sh fills strong values.
      MINIO_ROOT_USER: ${MESH_STORAGE_ACCESS_KEY:?MESH_STORAGE_ACCESS_KEY is required (scripts/gen-dev-secrets.sh for local dev)}
      MINIO_ROOT_PASSWORD: ${MESH_STORAGE_SECRET_KEY:?MESH_STORAGE_SECRET_KEY is required (scripts/gen-dev-secrets.sh for local dev)}
    volumes:
      - mesh_minio_data:/data
    ports:
      # Loopback-bound S3 API + console. The browser talks to object storage
      # DIRECTLY for presigned uploads/downloads (three-stage direct upload,
      # attachment.md §3), so a host-reachable endpoint is required even in
      # local dev — but it is bound to 127.0.0.1 ONLY, never the network.
      # Production must place object storage on a private network / behind a
      # TLS-terminating reverse proxy and MUST NOT expose it publicly.
      - "127.0.0.1:${MESH_STORAGE_PORT:-9000}:9000"
      - "127.0.0.1:${MESH_STORAGE_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    command: >
      sh -c "alembic upgrade head &&
             uvicorn mesh.api.app:create_app --factory --host 0.0.0.0 --port 8000 --no-access-log"
    environment:
      # Owner role: runs migrations (alembic upgrade head) and is available to
      # the app as a fallback; the app itself connects via MESH_APP_DATABASE_URL.
      MESH_DATABASE_URL: postgresql+asyncpg://${MESH_POSTGRES_USER:-mesh}:${MESH_POSTGRES_PASSWORD:?MESH_POSTGRES_PASSWORD is required (scripts/gen-dev-secrets.sh for local dev)}@postgres:5432/${MESH_POSTGRES_DB:-mesh}
      # Restricted non-owner role the API app connects as → RLS applies (M1).
      MESH_APP_DATABASE_URL: postgresql+asyncpg://mesh_app:${MESH_APP_DB_PASSWORD:?MESH_APP_DB_PASSWORD is required (scripts/gen-dev-secrets.sh for local dev)}@postgres:5432/${MESH_POSTGRES_DB:-mesh}
      # Read by migration 0002 to create/alter the mesh_app login role.
      MESH_APP_DB_PASSWORD: ${MESH_APP_DB_PASSWORD:?MESH_APP_DB_PASSWORD is required (scripts/gen-dev-secrets.sh for local dev)}
      MESH_REDIS_URL: redis://:${MESH_REDIS_PASSWORD:?MESH_REDIS_PASSWORD is required (scripts/gen-dev-secrets.sh for local dev)}@redis:6379/0
      MESH_AUTH_MODE: ${MESH_AUTH_MODE:-dev}
      # Machine API TLS red line (runtime.md §3.5): compose serves plaintext
      # loopback, so dev defaults off; production leaves it unset and the
      # secure default (true) applies — non-TLS /api/v1/daemon/ → 403.
      MESH_DAEMON_TLS_REQUIRED: ${MESH_DAEMON_TLS_REQUIRED:-false}
      # Device-code HMAC pepper (auth.md §2.4.2): dev default for the
      # loopback stack only — production MUST set a real secret
      # (auth_mode=production fails closed when unset).
      MESH_DEVICE_CODE_PEPPER: ${MESH_DEVICE_CODE_PEPPER:-mesh-dev-device-code-pepper-only}
      # Web session cookie Secure attribute: the loopback dev stack serves
      # plaintext http, so the Secure flag is relaxed locally (production
      # leaves it unset -> secure default true; auth.md R4-H1).
      MESH_SESSION_COOKIE_SECURE: ${MESH_SESSION_COOKIE_SECURE:-false}
      # OAuth dev mock provider redirect_uri allowlist (M1: exact-match, open-
      # redirect prevention). Dev default: the frontend dev server's OAuth
      # callback (both localhost spellings); production leaves it unset/empty
      # (mock disabled) and operators configure real providers' allowlists.
      MESH_OAUTH_MOCK_REDIRECT_URIS: ${MESH_OAUTH_MOCK_REDIRECT_URIS:-http://localhost:5173/auth/oauth/callback/mock,http://127.0.0.1:5173/auth/oauth/callback/mock}
      # Transactional email (production). In dev mode tokens go to the Redis
      # dev-mailbox regardless of these; SMTP is used only when AUTH_MODE is
      # production AND MESH_SMTP_HOST is set (see .env.example).
      MESH_SMTP_HOST: ${MESH_SMTP_HOST:-}
      MESH_SMTP_PORT: ${MESH_SMTP_PORT:-587}
      MESH_SMTP_USERNAME: ${MESH_SMTP_USERNAME:-}
      MESH_SMTP_PASSWORD: ${MESH_SMTP_PASSWORD:-}
      MESH_SMTP_FROM: ${MESH_SMTP_FROM:-noreply@mesh.local}
      MESH_SMTP_USE_TLS: ${MESH_SMTP_USE_TLS:-true}
      # Absolute browser origin used by email and external approval cards.
      # Relative DingTalk links resolve against DingTalk and are rejected.
      MESH_APP_BASE_URL: ${MESH_APP_BASE_URL:?MESH_APP_BASE_URL is required (scripts/gen-dev-secrets.sh for local dev)}
      # Object storage for attachments (attachment.md §3). The internal
      # endpoint is the compose-network address; the public endpoint is what a
      # browser can reach — presigned URLs must be signed against the public
      # one because the client talks to object storage directly.
      MESH_STORAGE_ENDPOINT: ${MESH_STORAGE_ENDPOINT:-http://minio:9000}
      MESH_STORAGE_PUBLIC_ENDPOINT: ${MESH_STORAGE_PUBLIC_ENDPOINT:-http://127.0.0.1:9000}
      MESH_STORAGE_REGION: ${MESH_STORAGE_REGION:-us-east-1}
      MESH_STORAGE_ACCESS_KEY: ${MESH_STORAGE_ACCESS_KEY:?MESH_STORAGE_ACCESS_KEY is required (scripts/gen-dev-secrets.sh for local dev)}
      MESH_STORAGE_SECRET_KEY: ${MESH_STORAGE_SECRET_KEY:?MESH_STORAGE_SECRET_KEY is required (scripts/gen-dev-secrets.sh for local dev)}
      MESH_STORAGE_BUCKET: ${MESH_STORAGE_BUCKET:-mesh-attachments}
      # Skill imports (skill.md §5.3 / §1.3): SSRF allowlist for source fetches +
      # optional external marketplace listings API. Empty = public-only / no market.
      MESH_SKILL_SOURCE_HOST_ALLOWLIST: ${MESH_SKILL_SOURCE_HOST_ALLOWLIST:-}
      MESH_SKILL_MARKETPLACE_URL: ${MESH_SKILL_MARKETPLACE_URL:-}
      # theme.md §2.3 ①: the HTML entry serves the built SPA from the shared
      # frontend_dist volume (populated by the frontend service at startup).
      MESH_FRONTEND_DIST_DIR: /srv/mesh/frontend
    volumes:
      - frontend_dist:/srv/mesh/frontend:ro
    ports:
      - "127.0.0.1:${MESH_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build: ./backend
    command: python -m mesh.workers
    environment:
      MESH_DATABASE_URL: postgresql+asyncpg://${MESH_POSTGRES_USER:-mesh}:${MESH_POSTGRES_PASSWORD:?MESH_POSTGRES_PASSWORD is required (scripts/gen-dev-secrets.sh for local dev)}@postgres:5432/${MESH_POSTGRES_DB:-mesh}
      MESH_REDIS_URL: redis://:${MESH_REDIS_PASSWORD:?MESH_REDIS_PASSWORD is required (scripts/gen-dev-secrets.sh for local dev)}@redis:6379/0
      MESH_AUTH_MODE: ${MESH_AUTH_MODE:-dev}
      # The worker emits DingTalk approval cards, so it needs the same public
      # browser origin as the API callback lifecycle writer.
      MESH_APP_BASE_URL: ${MESH_APP_BASE_URL:?MESH_APP_BASE_URL is required (scripts/gen-dev-secrets.sh for local dev)}
      # The attachment processing worker reads quarantine objects for MIME
      # sniffing / SHA-256 / AV scan / thumbnails (attachment.md §3.3) — it
      # uses the internal compose-network endpoint.
      MESH_STORAGE_ENDPOINT: ${MESH_STORAGE_ENDPOINT:-http://minio:9000}
      MESH_STORAGE_PUBLIC_ENDPOINT: ${MESH_STORAGE_PUBLIC_ENDPOINT:-http://127.0.0.1:9000}
      MESH_STORAGE_REGION: ${MESH_STORAGE_REGION:-us-east-1}
      MESH_STORAGE_ACCESS_KEY: ${MESH_STORAGE_ACCESS_KEY:?MESH_STORAGE_ACCESS_KEY is required (scripts/gen-dev-secrets.sh for local dev)}
      MESH_STORAGE_SECRET_KEY: ${MESH_STORAGE_SECRET_KEY:?MESH_STORAGE_SECRET_KEY is required (scripts/gen-dev-secrets.sh for local dev)}
      MESH_STORAGE_BUCKET: ${MESH_STORAGE_BUCKET:-mesh-attachments}
      # Skill imports (skill.md §5.3 / §1.3): SSRF allowlist for source fetches +
      # optional external marketplace listings API. Empty = public-only / no market.
      MESH_SKILL_SOURCE_HOST_ALLOWLIST: ${MESH_SKILL_SOURCE_HOST_ALLOWLIST:-}
      MESH_SKILL_MARKETPLACE_URL: ${MESH_SKILL_MARKETPLACE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  gateway:
    build: ./backend
    # --ws-max-size bounds a single WebSocket frame at the transport layer
    # (uvicorn default is 16MB); keep it in sync with Settings.ws_max_size_bytes.
    command: uvicorn mesh.realtime.app:create_app --factory --host 0.0.0.0 --port 8081 --ws-max-size 65536
    environment:
      MESH_DATABASE_URL: postgresql+asyncpg://${MESH_POSTGRES_USER:-mesh}:${MESH_POSTGRES_PASSWORD:?MESH_POSTGRES_PASSWORD is required (scripts/gen-dev-secrets.sh for local dev)}@postgres:5432/${MESH_POSTGRES_DB:-mesh}
      # Restricted non-owner role the gateway app connects as → RLS applies (M1).
      MESH_APP_DATABASE_URL: postgresql+asyncpg://mesh_app:${MESH_APP_DB_PASSWORD:?MESH_APP_DB_PASSWORD is required (scripts/gen-dev-secrets.sh for local dev)}@postgres:5432/${MESH_POSTGRES_DB:-mesh}
      MESH_REDIS_URL: redis://:${MESH_REDIS_PASSWORD:?MESH_REDIS_PASSWORD is required (scripts/gen-dev-secrets.sh for local dev)}@redis:6379/0
      MESH_AUTH_MODE: ${MESH_AUTH_MODE:-dev}
    ports:
      - "127.0.0.1:${MESH_WS_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    # Real SPA front-door (H5): builds the bundle and serves it same-origin via
    # nginx, reverse-proxying /api → api and /ws → gateway (no CORS needed).
    # Also publishes the build into the shared frontend_dist volume so the api
    # HTML entry can render the personalized shell (theme.md §2.3 ①).
    build:
      context: ./frontend
    volumes:
      - frontend_dist:/dist
    ports:
      - "127.0.0.1:${MESH_FRONTEND_PORT:-3001}:80"
    depends_on:
      - api
      - gateway

volumes:
  mesh_pgdata:
  mesh_minio_data:
  # Built SPA shared between the frontend image (writer, at startup) and the
  # api service (read-only, HTML entry template source).
  frontend_dist:
