# Mesh backend CI:
# 1) docs-checks — event vocabulary (§6.7) + roster-entry (§6.12/T35) doc gates on backend PRs too;
# 2) test — unit + real e2e (real server processes, real PostgreSQL 16, real Redis) with a ≥90% coverage gate,
#    installed from the committed lockfile (backend/requirements-dev.lock) so CI runs the exact pinned deps;
# 3) schema-validation — docs/specs/validation/schema_r2_validation.sql runs green on a disposable PG16;
# 4) supply-chain — pip-audit against both lockfiles; any known CVE fails the build. Also re-runs weekly so
#    newly disclosed CVEs in pinned versions are caught even without new commits.
#
# Governance (MES-145,MES-122 验收遗留):
# - 每个 job 显式 timeout-minutes,按实测余量设定——主 test job 随套件扩容
#   (4086 例)实测 52-60+min(饱和 runner 上 60min 已触顶被超时取消)→ 90min
#   (~50% 浮动余量);文档/DDL/供应链短 job 实测 <1min → 15min。
#   无此兜底时卡死 job 按 runner 默认 6h 阻塞门禁(MES-122 事故:合并推送触发的
#   main 复跑卡死 130+ 分钟仍未完成)。
# - workflow 级 concurrency(下方):同一 ref 的新 run 立即取消旧 run,杜绝同分支/
#   同 PR 多 run 互挤 runner——检查矩阵、路径过滤与覆盖率门禁语义一律不变。
name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "tests/docs/**"
      - "docs/api/**"
      - "cli/**"
      - "docs/specs/validation/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "tests/docs/**"
      - "docs/api/**"
      - "cli/**"
      - "docs/specs/validation/**"
      - ".github/workflows/backend-ci.yml"
  schedule:
    # Weekly supply-chain re-audit (Mondays 03:19 UTC). Only the supply-chain
    # job runs on schedule; the other jobs gate themselves out below.
    - cron: "19 3 * * 1"

# MES-145: 同一 ref 的新 run 立即取消在跑的旧 run,避免同分支/同 PR 多 run 互挤
# runner(MES-122 遗留:合并推送触发的 main 复跑与在跑 run 并发互挤,无超时兜底
# 卡死 130+ 分钟)。PR 的 ref 为 refs/pull/N/merge(按 PR 隔离,重复推送即取消旧
# run);push 为 refs/heads/<branch>。周一定时 supply-chain 复跑与 main push 同组:
# 即便被取消,触发取消的 push run 自身仍跑 supply-chain,CVE 审计覆盖不丢失。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-checks:
    name: 文档词汇/结构校验(§6.7, §6.12)
    runs-on: ubuntu-latest
    # MES-145: 实测 <1min,15min 为宽裕兜底(短 job 统一 15min)。
    timeout-minutes: 15
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check_event_vocab.py
        run: python3 tests/docs/check_event_vocab.py docs/specs
      - name: check_roster_entry.py
        run: python3 tests/docs/check_roster_entry.py docs/specs
      - name: check_openapi_surface.py
        # cli.md §5.4: the published contract must carry zero /api/v1/daemon/
        # paths (internal machine API fully stripped) and every CLI-required
        # endpoint (cli.md §3.1). Regenerate the artifact with
        # python backend/scripts/export_openapi.py.
        run: |
          python3 -m pip install --quiet pyyaml
          python3 tests/docs/check_openapi_surface.py docs/api/openapi.yaml

  test:
    name: 单测 + 真实 e2e(PostgreSQL 16 + Redis,覆盖率 ≥90%,lockfile 安装)
    runs-on: ubuntu-latest
    # MES-145: 套件扩容至 4086 例后实测 52-60+min(上一轮 52:29 压线通过、
    # 本轮饱和 runner 恰 60min 触顶被超时取消——系超时非测试失败),60min 已
    # 无余量 → 90min(~50% 浮动空间);卡死时 90min 终止而非按 runner 默认
    # 6h 挂死(MES-122 验收遗留)。用例与覆盖率门禁不变,仅放宽执行窗口;
    # 套件持续增长则测试并行化另立 follow-up。
    timeout-minutes: 90
    if: github.event_name != 'schedule'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: mesh
          POSTGRES_USER: mesh
          POSTGRES_DB: mesh
        ports:
          # MES-83: bind loopback — a CI datastore must never listen on all
          # interfaces, even on an ephemeral runner.
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U mesh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          # MES-83: bind loopback (never 0.0.0.0) — see postgres note above.
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # MinIO 不作为 service 声明:GitHub services 无法给 minio/minio 镜像传
    # `server /data` 启动命令(默认 entrypoint 无参即退出),故以独立步骤
    # docker run 起真实 MinIO(附件真实 e2e 的三阶段直传对象存储,零 mock)。
    steps:
      - uses: actions/checkout@v4
      - name: Generate strong MinIO credentials (MES-83)
        # Per-run random root credentials exported for every later step (the
        # MinIO container AND the test env). No static object-storage secret
        # lives in this public repository — the MES-83 incident exploited a
        # guessable default shipped here.
        run: |
          echo "MESH_STORAGE_ACCESS_KEY=mesh-ci-$(openssl rand -hex 8)" >> "$GITHUB_ENV"
          echo "MESH_STORAGE_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Start MinIO (attachment real e2e object storage)
        run: |
          docker run -d --name mesh-ci-minio \
            -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER="$MESH_STORAGE_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$MESH_STORAGE_SECRET_KEY" \
            minio/minio:RELEASE.2025-06-13T11-33-47Z \
            server /data
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1; then
              echo "MinIO ready"
              exit 0
            fi
            sleep 1
          done
          echo "MinIO did not become ready" >&2
          docker logs mesh-ci-minio >&2 || true
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend (pinned, from lockfile)
        run: |
          pip install -r backend/requirements-dev.lock
          pip install -e backend/ --no-deps
      - name: Verify lockfile satisfies pyproject (drift gate)
        # Fails if pyproject.toml gained a dependency the lockfile does not
        # cover (mesh-backend's Requires-Dist would be unsatisfied) — catches
        # "bumped pyproject, forgot to regenerate the lockfile" before tests.
        run: pip check
      - name: Lint (ruff)
        run: ruff check backend/src backend/tests
      - name: Run unit + e2e with coverage gate
        env:
          MESH_TEST_DATABASE_URL: postgresql+asyncpg://mesh:mesh@127.0.0.1:5432/mesh_test
          MESH_TEST_REDIS_URL: redis://127.0.0.1:6379/1
          MESH_TEST_STORAGE_ENDPOINT: http://127.0.0.1:9000
          # MESH_STORAGE_ACCESS_KEY / MESH_STORAGE_SECRET_KEY are the per-run
          # strong values generated above (via $GITHUB_ENV) — never hardcoded.
        run: |
          cd backend
          pytest --cov=mesh --cov-report=term-missing --cov-fail-under=90

  schema-validation:
    name: DDL 与行为验证(PostgreSQL 16)
    runs-on: ubuntu-latest
    # MES-145: 实测 <1min,15min 为宽裕兜底(短 job 统一 15min)。
    timeout-minutes: 15
    if: github.event_name != 'schedule'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: mesh
          POSTGRES_DB: mesh_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run schema_r2_validation.sql
        env:
          PGPASSWORD: mesh
        run: |
          psql -h 127.0.0.1 -U postgres -d mesh_validation \
            -v ON_ERROR_STOP=1 \
            -f docs/specs/validation/schema_r2_validation.sql

  supply-chain:
    name: 供应链审计(pip-audit 对 lockfile,命中已知 CVE 即失败)
    runs-on: ubuntu-latest
    # MES-145: 实测 <1min(含 OSV 数据拉取),15min 为宽裕兜底(短 job 统一 15min)。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        # Pinned; bump deliberately (verify against both lockfiles before raising).
        run: pip install "pip-audit==2.10.1"
      # Ignore policy: NONE today — both lockfiles audit clean. Any future
      # --ignore-vuln <ID> MUST carry an inline comment with the reason and a
      # review-by date; silently ignoring findings is forbidden (MES-34).
      - name: pip-audit runtime lockfile (backend/requirements.lock)
        run: pip-audit --strict --progress-spinner off -r backend/requirements.lock
      - name: pip-audit dev lockfile (backend/requirements-dev.lock)
        run: pip-audit --strict --progress-spinner off -r backend/requirements-dev.lock
