name: MES-108 model card

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "docs/specs/frontend/mes108-reconciliation/**"
      - ".github/workflows/mes108-model-card.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "docs/specs/frontend/mes108-reconciliation/**"
      - ".github/workflows/mes108-model-card.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Fetch pinned static prototype revision
        working-directory: .
        shell: bash
        run: |
          revision="$(node -e "const fs = require('node:fs'); const card = JSON.parse(fs.readFileSync('frontend/model-card/mes108-react-migration.json', 'utf8')); process.stdout.write(card.blueprint.revision)")"
          git fetch --no-tags --depth=1 origin "$revision"

      - name: Test model-card validator core
        run: >-
          node --experimental-test-coverage
          --test-coverage-include=scripts/model-card-lib.mjs
          --test-coverage-lines=90
          --test-coverage-branches=90
          --test-coverage-functions=90
          --test scripts/__tests__/model-card-validation.node.mjs

      - name: Test model-card validator CLI
        run: >-
          node --experimental-test-coverage
          --test-coverage-include=scripts/verify-model-card.mjs
          --test-coverage-lines=90
          --test-coverage-branches=90
          --test-coverage-functions=90
          --test scripts/__tests__/model-card-validation.node.mjs

      - name: Validate inventories and generated documentation
        run: node scripts/verify-model-card.mjs --mode audit

      - name: Enforce release gate after prototype confirmation
        shell: bash
        run: |
          if node -e "const fs = require('node:fs'); const card = JSON.parse(fs.readFileSync('model-card/mes108-react-migration.json', 'utf8')); process.exit(card.blueprint.confirmed === true ? 0 : 1)"; then
            node scripts/verify-model-card.mjs --mode release
          else
            echo "Prototype confirmation is pending; structural audit remains authoritative."
          fi
