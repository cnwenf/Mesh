# mesh CLI release pipeline (cli.md §5.4 版本、分发与 OpenAPI).
#
# Tag `cli-v*` → per-platform static single binaries (PyInstaller --onefile,
# native runners — no cross-compilation), each published to the GitHub Release
# with a SHA-256 checksum AND a minisign signature verified by cli/install.sh
# against the public key shipped in the repository (cli/mesh-release.pub,
# same baseline as the runtime.md install package).
#
# Required repository secret (maintainer one-time setup):
#   MESH_RELEASE_MINISIGN_KEY — base64 of the minisign SECRET key
#     (base64 -w0 < mesh-release.key). The key is unencrypted by design so the
#     pipeline can sign unattended; rotation = new keypair, replace the secret,
#     commit the new public key, and re-publish old releases' signatures.
name: cli-release

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: write

# MES-145 (与 backend-ci 统一治理):
# - concurrency 按 tag ref 分组、cancel-in-progress: false——同一 tag 被重推时
#   串行化而**绝不取消**签名/发布进行中的 run(发布流不同于 CI 门禁,中途取消
#   会留下签了一半的 Release)。
# - 每个 job 显式 timeout-minutes:构建 job 45min(PyInstaller 四平台,macOS
#   runner 偏慢)、签名发布 20min——无兜底时卡死 job 按默认 6h 挂着。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建单二进制(${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45 # MES-145: PyInstaller 单二进制构建兜底(macOS runner 偏慢)
    strategy:
      fail-fast: true
      matrix:
        include:
          - label: linux-x86_64
            runner: ubuntu-latest
            os: linux
            arch: x86_64
          - label: linux-aarch64
            runner: ubuntu-24.04-arm
            os: linux
            arch: aarch64
          - label: darwin-aarch64
            runner: macos-14
            os: darwin
            arch: aarch64
          - label: darwin-x86_64
            runner: macos-13
            os: darwin
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install ./cli
      - name: Build single binary
        run: |
          pyinstaller --onefile --clean --strip \
            --name "mesh-${{ matrix.os }}-${{ matrix.arch }}" \
            --distpath dist \
            cli/src/meshcli/__main__.py
          ./dist/mesh-${{ matrix.os }}-${{ matrix.arch }} --version
      - name: SHA-256 checksum
        run: |
          cd dist
          case "${{ matrix.os }}" in
            linux) sha256sum "mesh-${{ matrix.os }}-${{ matrix.arch }}" > "mesh-${{ matrix.os }}-${{ matrix.arch }}.sha256" ;;
            darwin) shasum -a 256 "mesh-${{ matrix.os }}-${{ matrix.arch }}" > "mesh-${{ matrix.os }}-${{ matrix.arch }}.sha256" ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: mesh-${{ matrix.label }}
          path: |
            dist/mesh-${{ matrix.os }}-${{ matrix.arch }}
            dist/mesh-${{ matrix.os }}-${{ matrix.arch }}.sha256

  sign-and-release:
    name: 签名 + 发布 Release(SHA-256 + minisign 双验)
    runs-on: ubuntu-latest
    timeout-minutes: 20 # MES-145: 签名 + Release 创建兜底
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Sign every binary
        env:
          MESH_RELEASE_MINISIGN_KEY: ${{ secrets.MESH_RELEASE_MINISIGN_KEY }}
        run: |
          if [ -z "$MESH_RELEASE_MINISIGN_KEY" ]; then
            echo "::error::MESH_RELEASE_MINISIGN_KEY secret is not configured"
            exit 1
          fi
          printf '%s' "$MESH_RELEASE_MINISIGN_KEY" | base64 -d > release.key
          chmod 600 release.key
          cd artifacts
          for binary in mesh-*-*; do
            case "$binary" in *.sha256|*.minisig) continue ;; esac
            minisign -S -s ../release.key -m "$binary" -x "$binary.minisig"
          done
          sha256sum mesh-*-* | grep -v '\.sha256\|\.minisig' > checksums.txt
      - name: Verify signatures against the shipped public key
        run: |
          cd artifacts
          for sig in *.minisig; do
            binary="${sig%.minisig}"
            minisign -V -p ../cli/mesh-release.pub -m "$binary" -x "$sig"
          done
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "mesh CLI ${GITHUB_REF_NAME}" \
            --notes "mesh CLI release. Install: download your platform binary + verify with cli/install.sh (SHA-256 + minisign against cli/mesh-release.pub). Do not pipe curl to sh." \
            artifacts/mesh-*-* \
            artifacts/checksums.txt
