# Mesh 命脉层 real_llm workflow — MES-95(设计 runtime-executor.md §5.4.4)。
#
# 真烧 LLM 的全链路验收:单 agent 真实执行(real_llm_e2e.py)+ 多 agent 组队
# 真实完成 issue(real_llm_squad_e2e.py)。这是产品核心价值的命脉测试,
# **不是**常规 CI——常规 CI(backend-ci / daemon-ci)用 fake provider 覆盖
# 状态机/隔离/恢复,fake 永不冒充命脉层。
#
# 红线(§5.4.4,不可放宽):
# - 仅 workflow_dispatch(手动)+ schedule(nightly)触发。**没有**
#   pull_request 触发 → 外部 PR 永远不会执行本 workflow、永远接触不到
#   provider 凭证。
# - 只在受保护的内部 self-hosted runner 上跑(runs-on 标签 + 仓库归属
#   双重闸门);不接受外部 PR 提供的 runner/镜像/DNS/secret。
# - concurrency=1:同一时刻只允许一次真实运行(显式预算、串行核账)。
# - 凭证仅来自仓库 secrets,运行前以 0600 落盘,证据经同一脱敏器脱敏后
#   才作为 artifact 上传。
name: real-llm

on:
  workflow_dispatch:
    inputs:
      budget_usd:
        description: "单 agent 预算上限(USD,squad e2e 内 leader/member 分别计)"
        required: false
        default: "1.00"
      model:
        description: "冻结模型名(留空用 provider.env 的 ANTHROPIC_MODEL)"
        required: false
        default: ""
  schedule:
    # nightly 03:17 UTC(避开整点拥塞)。
    - cron: "17 3 * * *"

concurrency:
  group: real-llm
  cancel-in-progress: false

# 最小权限(L3 安全复审建议):命脉 workflow 不需要任何仓库写权限——
# 证据经 artifact 上传(upload-artifact 自带所需权限),不推 ref、不改内容。
permissions: {}

jobs:
  real-llm-e2e:
    name: 真 LLM 全链路命脉测试(单 agent + 多 agent 组队)
    # 受保护自托管 runner;标签缺失时调度挂起而不是降级到公共 runner。
    runs-on: [self-hosted, mes-protected-runner]
    # 仓库归属闸门(双保险):fork 触发的任何 ref 一律拒绝。
    if: github.repository == 'cnwenf/Mesh'
    timeout-minutes: 60
    env:
      MESH_REAL_LLM_BUDGET_USD: ${{ inputs.budget_usd || '1.00' }}
      MESH_REAL_LLM_MODEL: ${{ inputs.model || '' }}
    steps:
      # 第三方 action 一律 SHA 钉死(L3 安全复审建议;注释标注对应版本,
      # 升级时同步换 SHA)。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Refuse non-protected event kinds (defense in depth)
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch|schedule) echo "event ok: ${{ github.event_name }}" ;;
            *) echo "real_llm only runs on workflow_dispatch/schedule" >&2; exit 1 ;;
          esac

      - name: Install daemon + backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -e './daemon[dev]'
          pip install -e ./backend

      - name: Materialize pinned provider + credentials (0600, from secrets only)
        env:
          PROVIDER_URL: ${{ secrets.MESH_REAL_LLM_PROVIDER_URL }}
          PROVIDER_SHA256: ${{ secrets.MESH_REAL_LLM_PROVIDER_SHA256 }}
          PROVIDER_ENV_B64: ${{ secrets.MESH_REAL_LLM_PROVIDER_ENV_B64 }}
          MANIFEST_B64: ${{ secrets.MESH_REAL_LLM_MANIFEST_B64 }}
        run: |
          set -eu
          test -n "$PROVIDER_URL" && test -n "$PROVIDER_SHA256"
          test -n "$PROVIDER_ENV_B64" && test -n "$MANIFEST_B64"
          mkdir -p "${RUNNER_TEMP}/mes-provider"
          chmod 700 "${RUNNER_TEMP}/mes-provider"
          curl -fsSL "$PROVIDER_URL" -o "${RUNNER_TEMP}/mes-provider/claude"
          echo "${PROVIDER_SHA256}  ${RUNNER_TEMP}/mes-provider/claude" | sha256sum -c -
          chmod 755 "${RUNNER_TEMP}/mes-provider/claude"
          umask 077
          echo "$PROVIDER_ENV_B64" | base64 -d > "${RUNNER_TEMP}/mes-provider/provider.env"
          echo "$MANIFEST_B64" | base64 -d > "${RUNNER_TEMP}/mes-provider/manifest.toml"

      - name: Boot local Mesh stack (loopback-only, generated secrets)
        run: |
          set -eu
          ./scripts/gen-dev-secrets.sh --force
          # loopback-bound ports; datastores are NEVER published (MES-83).
          docker compose -p mes-real-llm up -d --build postgres redis minio api worker gateway
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -X POST http://127.0.0.1:8000/api/v1/auth/login \
              -H 'Content-Type: application/json' -d '{}' || true)
            [ "$code" = "400" ] && break
            sleep 2
          done

      - name: Run single-agent real LLM e2e
        env:
          MES101_PROVIDER_PATH: ${{ runner.temp }}/mes-provider/claude
          MES101_PROVIDER_MANIFEST: ${{ runner.temp }}/mes-provider/manifest.toml
          MES101_PROVIDER_ENV: ${{ runner.temp }}/mes-provider/provider.env
          MES101_WORK_ROOT: ${{ runner.temp }}/mes-run
          MES101_MODEL: ${{ env.MESH_REAL_LLM_MODEL }}
        run: |
          set -eu
          mkdir -p "${MES101_WORK_ROOT}" && chmod 700 "${MES101_WORK_ROOT}"
          sudo -E "$(command -v python)" daemon/tests/integration/real_llm_e2e.py \
            http://127.0.0.1:8000

      - name: Run multi-agent squad real LLM e2e (命脉)
        env:
          MES95_PROVIDER_PATH: ${{ runner.temp }}/mes-provider/claude
          MES95_PROVIDER_MANIFEST: ${{ runner.temp }}/mes-provider/manifest.toml
          MES95_PROVIDER_ENV: ${{ runner.temp }}/mes-provider/provider.env
          MES95_WORK_ROOT: ${{ runner.temp }}/mes-run
          MES95_MODEL: ${{ env.MESH_REAL_LLM_MODEL }}
          MES95_LEADER_BUDGET_USD: ${{ env.MESH_REAL_LLM_BUDGET_USD }}
          MES95_MEMBER_BUDGET_USD: ${{ env.MESH_REAL_LLM_BUDGET_USD }}
        run: |
          set -eu
          sudo -E "$(command -v python)" daemon/tests/integration/real_llm_squad_e2e.py \
            http://127.0.0.1:8000

      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-llm-evidence
          path: |
            docs/evidence/mes-101/real-llm-e2e.json
            docs/evidence/mes-95/real-llm-squad-e2e.json
          if-no-files-found: ignore

      - name: Tear down stack + shred credentials
        if: always()
        run: |
          docker compose -p mes-real-llm down -v || true
          rm -rf "${RUNNER_TEMP}/mes-provider" "${RUNNER_TEMP}/mes-run" || true
