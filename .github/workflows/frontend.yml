# Mesh 前端 CI:lint → 类型检查 → 单元/组件测试(覆盖率 ≥90% 门禁)→ 生产构建 → 真实浏览器 e2e
#
# Governance (MES-145,与 backend-ci 统一治理):每个 job 显式 timeout-minutes(实测
# 余量:quality ~5min → 30min;浏览器 e2e/视觉 ~2-3min、全栈走查 ~2min 热路径但冷
# 路径含镜像拉取/pip/playwright 安装 → e2e·visual 30min、全栈走查 45min;contrast
# ~20s → 15min),workflow 级 concurrency 同 ref 新 run 取消旧 run——检查矩阵与
# 门禁语义不变。
name: frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

defaults:
  run:
    working-directory: frontend

# MES-145: 同一 ref 的新 run 立即取消在跑的旧 run(PR ref=refs/pull/N/merge,重复
# 推送即取消旧 run),避免多 run 互挤 runner 拖垮门禁。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    # MES-145: 实测 ~5min(npm ci + lint + typecheck + 覆盖率 + 构建),30min 兜底。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 新增代码覆盖率校验需要与 main 的 diff

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependency tree (high severity fails)
        run: npm audit --audit-level=high

      - name: Verify Appica version, MIT notice, and subpath imports
        run: npm run check:appica

      - name: Lint
        run: npm run lint

      - name: Lint CSS (hardcoded color gate, theme.md §5.4)
        run: npm run lint:css

      - name: Responsive contract (central breakpoints + safe-area)
        run: npm run check:responsive

      - name: Accessibility structure contract (landmarks + overlays + tables)
        run: npm run check:a11y-contract

      - name: Legacy token debt does not increase
        run: npm run check:legacy-token-debt

      - name: Type check
        run: npm run typecheck

      - name: Verify real-stack harness contracts
        run: npm run test:e2e:mes128-contracts

      - name: Unit & component tests (coverage >= 90% gate)
        run: npm run test:coverage
        env:
          # i18n 文案守卫词表(§5.3):仓库外注入;secret 未配置时为空,守卫退化为空校验
          MESH_COPY_DENYLIST: ${{ secrets.MESH_COPY_DENYLIST }}

      - name: Verify new/changed code coverage >= 90%
        run: node scripts/verify-coverage.mjs --base origin/${{ github.base_ref || 'main' }}

      - name: Evidence screenshots are complete and unique
        run: npm run check:evidence

      - name: Production build
        run: npm run build

      - name: Token CSS generation is idempotent (theme.md §5.4)
        # tokens.css/tokens-dark.css/tokens-print.css/appica-tokens.css are generated from
        # tokenValues.ts; a hand-edit would surface as a post-generation diff.
        run: |
          npm run gen:tokens
          git diff --exit-code -- src/design/tokens.css src/design/tokens-dark.css src/design/tokens-print.css src/design/appica-tokens.css

  contrast:
    # 对比度独立关卡(theme.md §5.4):tokenValues.ts 单一事实源逐对校验,
    # 亮/暗两套 × text 4.5:1 / large-text·graphic 3:1,任一不达标即失败。
    runs-on: ubuntu-latest
    # MES-145: 实测 ~20s,15min 为宽裕兜底(短 job 统一 15min)。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check WCAG 2.1 AA contrast pairs (light + dark)
        run: npm run check:contrast

  e2e:
    runs-on: ubuntu-latest
    # MES-145: 实测 ~3min(含 Playwright 浏览器安装),30min 兜底。
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run real-browser e2e (mock contract server + production preview)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  visual:
    # 视觉回归门禁(theme.md §5.4):13 页 × light/dark × 手机/平板/桌面/宽屏固定矩阵,
    # 确定性环境(冻结时钟 / UTC / zh-CN / 内置字体锁定 / 动态区 mask)下
    # toHaveScreenshot 基线比对。常规跑只比对不更新;基线更新经独立 PR。
    # 独立端口(8911 / 5199)避免与默认 mock 套件(8901 / 5173)冲突。
    runs-on: ubuntu-latest
    # MES-128:104 个主题/视口基线 + 媒体偏好检查,30min 兜底。
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run visual regression gate (baseline compare, no --update-snapshots)
        run: npm run test:e2e:visual

      - name: Upload Playwright report (visual)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Upload visual diff artifacts (actual / expected / diff)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-results
          path: frontend/test-results
          retention-days: 7

  accessibility-e2e:
    # MES-128:axe WCAG A/AA 扫描,桌面 + 真实触控手机,确定性 mock + fresh production preview。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run axe WCAG A/AA gate
        run: npm run test:e2e:a11y

      - name: Upload Playwright report (accessibility)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-playwright-report
          path: frontend/playwright-report
          retention-days: 7

  mes128-real-stack-e2e:
    # MES-128/MES-158/MES-161:production 鉴权隔离栈；1440/320/390px 完成真实键盘
    # 旅程与主题往返，再以 1440/390px 验收全局辅助页族，同时断言真实 HTTP 响应、
    # 容器内 PostgreSQL 真值及 Appica shell runtime。只有 loopback 前端端口发布到
    # 宿主，所有中间件凭据均为本 job 即时生成的强随机值。
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: quality
    env:
      # Exercise the public port knob in CI instead of silently accepting its default.
      MES128_FRONTEND_PORT: 28430
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate isolated strong credentials
        run: ./e2e/mes128-real/gen-stack-env.sh --force

      - name: Run desktop/mobile real-stack keyboard, theme, and project journeys
        run: ./e2e/mes128-real/run-e2e.sh

      - name: Upload redacted journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mes128-real-stack-evidence
          path: |
            frontend/e2e/evidence/mes111-b5-real
            frontend/e2e/evidence/mes161
          retention-days: 14

      - name: Upload Playwright report (real stack)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mes128-real-stack-playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  attachment-e2e:
    # 附件模块真实后端浏览器走查(MES-59 §5 验收):真 PostgreSQL + Redis +
    # MinIO + uvicorn api/worker/gateway 全栈,真浏览器注册/上传(直传 MinIO)/
    # 隔离区闸门/灯箱缩放旋转/秒传 possession/删除,截图留证。
    runs-on: ubuntu-latest
    # MES-145: 热路径实测 ~2min,冷路径含 PG/Redis 镜像拉取 + pip 安装 +
    # Playwright 浏览器安装,45min 兜底。
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: mesh
          POSTGRES_USER: mesh
          POSTGRES_DB: mesh
        ports:
          # MES-83: bind loopback — a CI datastore must never listen on all
          # interfaces, even on an ephemeral runner.
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U mesh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          # MES-83: bind loopback (never 0.0.0.0) — see postgres note above.
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MESH_DATABASE_URL: postgresql+asyncpg://mesh:mesh@127.0.0.1:5432/mesh
      MESH_APP_DATABASE_URL: postgresql+asyncpg://mesh_app:mesh_app@127.0.0.1:5432/mesh
      MESH_APP_DB_PASSWORD: mesh_app
      MESH_REDIS_URL: redis://127.0.0.1:6379/0
      MESH_AUTH_MODE: dev
      MESH_STORAGE_ENDPOINT: http://127.0.0.1:9000
      MESH_STORAGE_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      # MESH_STORAGE_ACCESS_KEY / MESH_STORAGE_SECRET_KEY are NOT set here:
      # each job generates strong per-run values via $GITHUB_ENV (MES-83 — no
      # static object-storage secret may live in this public repository).
      MESH_STORAGE_BUCKET: mesh-attachments
    steps:
      - uses: actions/checkout@v4

      # MinIO 不经 services 声明:GitHub services 无法给 minio/minio 传
      # `server /data` 启动命令(默认 entrypoint 无参即退出)。
      - name: Generate strong MinIO credentials (MES-83)
        # Per-run random root credentials exported via $GITHUB_ENV for every
        # later step (MinIO container + backend servers + Playwright). No
        # static object-storage secret lives in this public repository.
        run: |
          echo "MESH_STORAGE_ACCESS_KEY=mesh-ci-$(openssl rand -hex 8)" >> "$GITHUB_ENV"
          echo "MESH_STORAGE_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Start MinIO
        run: |
          docker run -d --name mesh-ci-minio \
            -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER="$MESH_STORAGE_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$MESH_STORAGE_SECRET_KEY" \
            minio/minio:RELEASE.2025-06-13T11-33-47Z \
            server /data
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1; then
              echo "MinIO ready"
              exit 0
            fi
            sleep 1
          done
          echo "MinIO did not become ready" >&2
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 注意:本 workflow 顶层 defaults.run.working-directory=frontend(相对
      # GITHUB_WORKSPACE);无 working-directory 的步骤在 frontend/ 下执行
      # (经 ../backend 引后端),显式 working-directory 则相对 GITHUB_WORKSPACE,
      # 故后端步骤须写 backend(而非 ../backend)。
      - name: Install backend (pinned, from lockfile)
        run: |
          pip install -r ../backend/requirements-dev.lock
          pip install -e ../backend/ --no-deps

      - name: Migrate database
        working-directory: backend
        run: alembic upgrade head

      - name: Start api / gateway / worker
        working-directory: backend
        run: |
          nohup python -m uvicorn mesh.api.app:create_app --factory --host 127.0.0.1 --port 8000 > /tmp/mesh-api.log 2>&1 &
          nohup python -m uvicorn mesh.realtime.app:create_app --factory --host 127.0.0.1 --port 8081 --ws-max-size 65536 > /tmp/mesh-gateway.log 2>&1 &
          nohup python -m mesh.workers > /tmp/mesh-worker.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/healthz >/dev/null 2>&1 && curl -fsS http://127.0.0.1:8081/healthz >/dev/null 2>&1; then
              echo "api + gateway ready"
              exit 0
            fi
            sleep 1
          done
          echo "backend did not become ready" >&2
          tail -20 /tmp/mesh-api.log /tmp/mesh-gateway.log /tmp/mesh-worker.log >&2 || true
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run attachment real-backend browser walkthrough
        run: npx playwright test --config=playwright.attachment-real.config.ts

      - name: Upload walkthrough evidence (screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attachment-e2e-evidence
          path: frontend/e2e/evidence/attachments
          retention-days: 14

      - name: Upload Playwright report (attachment e2e)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: attachment-playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

      - name: Dump backend logs on failure
        if: failure()
        run: tail -40 /tmp/mesh-api.log /tmp/mesh-gateway.log /tmp/mesh-worker.log || true

  runtimes-e2e:
    # runtime 模块真实后端浏览器走查(runtime.md §4 验收 / MES-62):真 PostgreSQL
    # + Redis + MinIO + uvicorn api/worker/gateway 全栈,真浏览器注册/登录 →
    # Runtimes 列表 → 注册向导(一次性激活码 + 可审安装脚本)→ 落库 runtime/
    # execution 可见 → 执行详情(日志面板/取消/凭证脱敏),截图留证。
    # playwright.runtimes.config.ts 的 psql 播种经 RUNTIMES_PG_* 直连 service。
    runs-on: ubuntu-latest
    # MES-145: 热路径实测 ~2min,冷路径含 PG/Redis 镜像拉取 + pip 安装 +
    # Playwright 浏览器安装,45min 兜底。
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: mesh
          POSTGRES_USER: mesh
          POSTGRES_DB: mesh
        ports:
          # MES-83: bind loopback — a CI datastore must never listen on all
          # interfaces, even on an ephemeral runner.
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U mesh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          # MES-83: bind loopback (never 0.0.0.0) — see postgres note above.
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MESH_DATABASE_URL: postgresql+asyncpg://mesh:mesh@127.0.0.1:5432/mesh
      MESH_APP_DATABASE_URL: postgresql+asyncpg://mesh_app:mesh_app@127.0.0.1:5432/mesh
      MESH_APP_DB_PASSWORD: mesh_app
      MESH_REDIS_URL: redis://127.0.0.1:6379/0
      MESH_AUTH_MODE: dev
      MESH_STORAGE_ENDPOINT: http://127.0.0.1:9000
      MESH_STORAGE_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      # MESH_STORAGE_ACCESS_KEY / MESH_STORAGE_SECRET_KEY are NOT set here:
      # each job generates strong per-run values via $GITHUB_ENV (MES-83 — no
      # static object-storage secret may live in this public repository).
      MESH_STORAGE_BUCKET: mesh-attachments
      RUNTIMES_PG_HOST: 127.0.0.1
      RUNTIMES_PG_PORT: "5432"
      RUNTIMES_PG_USER: mesh
      RUNTIMES_PG_PASSWORD: mesh
      RUNTIMES_PG_DATABASE: mesh
    steps:
      - uses: actions/checkout@v4

      - name: Generate strong MinIO credentials (MES-83)
        run: |
          echo "MESH_STORAGE_ACCESS_KEY=mesh-ci-$(openssl rand -hex 8)" >> "$GITHUB_ENV"
          echo "MESH_STORAGE_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Start MinIO
        run: |
          docker run -d --name mesh-ci-minio-rt \
            -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER="$MESH_STORAGE_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$MESH_STORAGE_SECRET_KEY" \
            minio/minio:RELEASE.2025-06-13T11-33-47Z \
            server /data
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1; then
              echo "MinIO ready"
              exit 0
            fi
            sleep 1
          done
          echo "MinIO did not become ready" >&2
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend (pinned, from lockfile)
        run: |
          pip install -r ../backend/requirements-dev.lock
          pip install -e ../backend/ --no-deps

      - name: Migrate database
        working-directory: backend
        run: alembic upgrade head

      - name: Start api / gateway / worker
        working-directory: backend
        run: |
          nohup python -m uvicorn mesh.api.app:create_app --factory --host 127.0.0.1 --port 8000 > /tmp/mesh-api.log 2>&1 &
          nohup python -m uvicorn mesh.realtime.app:create_app --factory --host 127.0.0.1 --port 8081 --ws-max-size 65536 > /tmp/mesh-gateway.log 2>&1 &
          nohup python -m mesh.workers > /tmp/mesh-worker.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/healthz >/dev/null 2>&1 && curl -fsS http://127.0.0.1:8081/healthz >/dev/null 2>&1; then
              echo "api + gateway ready"
              exit 0
            fi
            sleep 1
          done
          echo "backend did not become ready" >&2
          tail -20 /tmp/mesh-api.log /tmp/mesh-gateway.log /tmp/mesh-worker.log >&2 || true
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run runtimes real-backend browser walkthrough
        run: npx playwright test --config=playwright.runtimes.config.ts

      - name: Upload walkthrough evidence (screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtimes-e2e-evidence
          path: frontend/e2e/evidence/runtimes
          retention-days: 14

      - name: Upload Playwright report (runtimes e2e)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtimes-playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

      - name: Dump backend logs on failure
        if: failure()
        run: tail -40 /tmp/mesh-api.log /tmp/mesh-gateway.log /tmp/mesh-worker.log || true
