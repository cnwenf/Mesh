# Mesh daemon (mesh-runtime) CI — MES-94 stage A1.
#
# The A1 daemon tests are hermetic: a FakeClock (no real waits) and a scripted
# fake server over httpx.MockTransport (real HTTP semantics, zero network). No
# database, Redis or object storage is required. Gates: ruff lint + pytest with
# a ≥90% branch-coverage floor (pyproject fail_under).
name: daemon-ci

on:
  push:
    branches: [main]
    paths:
      - "daemon/**"
      - ".github/workflows/daemon-ci.yml"
  pull_request:
    paths:
      - "daemon/**"
      - ".github/workflows/daemon-ci.yml"

jobs:
  test:
    name: mesh-runtime 单测 + 合同测试(覆盖率 ≥90%,无网络/无 LLM)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Ruff lint
        run: ruff check src/ tests/
      - name: Unit + contract tests with coverage gate
        run: pytest --cov=mesh_runtime --cov-report=term-missing
