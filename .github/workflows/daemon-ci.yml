# Mesh daemon (mesh-runtime) CI — MES-94 stage A1→A2.
#
# Two gates:
# 1. ruff lint + the full pytest suite with the ≥90% branch-coverage floor
#    (pyproject fail_under). The suite runs UNDER SUDO: the A2 sandbox,
#    full-stack and ISO-01~14 red-line tests exercise REAL Linux
#    namespace/cgroup/network isolation and fail (never skip) without root —
#    a sandbox the runner cannot prove is a sandbox the daemon may not claim.
# 2. hermetic unit/contract tests stay hermetic (FakeClock, scripted fake
#    server over httpx.MockTransport) — no database, Redis, network or LLM.
#
# Governance (MES-145,与 backend-ci 统一治理):test job 显式 timeout-minutes
# (实测 ~1min,ISO-01~14 红线矩阵两遍 + 慢 runner 余量 → 45min),workflow 级
# concurrency 同 ref 新 run 取消旧 run——检查矩阵与覆盖率门禁语义不变。
name: daemon-ci

on:
  push:
    branches: [main]
    paths:
      - "daemon/**"
      - ".github/workflows/daemon-ci.yml"
  pull_request:
    paths:
      - "daemon/**"
      - ".github/workflows/daemon-ci.yml"

# MES-145: 同一 ref 的新 run 立即取消在跑的旧 run(PR ref=refs/pull/N/merge,重复
# 推送即取消旧 run),避免多 run 互挤 runner。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: mesh-runtime 全量测试(含 ISO-01~14 红线矩阵,root 真环境,覆盖率 ≥90%)
    runs-on: ubuntu-latest
    # MES-145: 实测 ~1min;ISO-01~14 红线矩阵两遍(套件内 + junit 存证)+
    # 慢 runner 余量,45min 兜底。
    timeout-minutes: 45
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Ruff lint
        run: ruff check src/ tests/
      - name: Full suite incl. real sandbox + ISO red-line matrix (root)
        # Resolve the interpreter BEFORE sudo: secure_path would otherwise
        # re-resolve `python` to the system interpreter, which lacks pytest
        # and the dev deps installed into the setup-python toolcache.
        run: sudo -E "$(command -v python)" -m pytest --cov=mesh_runtime --cov-report=term-missing
      - name: ISO matrix junit evidence
        if: always()
        run: |
          sudo -E "$(command -v python)" -m pytest tests/isolation --junit-xml=iso-matrix-junit.xml || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iso-matrix-junit
          path: daemon/iso-matrix-junit.xml
